name = "house-cleaning-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "house-cleaning-reports"
database_id = "5389b7bb-7610-4f97-a51a-73c698bee84b"

# Secrets (set these in the Cloudflare dashboard, never in this file or in Git):
