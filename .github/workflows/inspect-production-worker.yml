name: Inspect production Worker

on:
  push:
    branches:
      - diag/inspect-production-worker

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Worker metadata and AppState
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== Worker settings ==="
          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/hcbototcet/settings"             -o settings.json
          python3 - <<'PY'
          import json
          d=json.load(open("settings.json"))
          r=d.get("result") or {}
          print("compatibility_date:", r.get("compatibility_date"))
          print("compatibility_flags:", r.get("compatibility_flags"))
          print("bindings:")
          for b in r.get("bindings") or []:
              safe={k:v for k,v in b.items() if k not in {"text","data","secret_text"}}
              print(safe)
          PY

          echo "=== AppState references in deployed script ==="
          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/hcbototcet/content"             -o worker-content.bin
          strings worker-content.bin | grep -n -C 20 "AppState" || true
